name: Website

# biokids.bilalgurkansanli.com: website/build.py turns website/ into static HTML
# and GitHub Pages serves it. Pull requests only build and check it; a push to
# main also publishes it. The custom domain is set once in the repository's
# settings (Pages: source "GitHub Actions", custom domain, Enforce HTTPS) and a
# CNAME record for "biokids" points at bilalgurkansanli.github.io.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/biokids_core/data/static/fonts/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/biokids_core/data/static/fonts/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so each page's "last updated" and the sitemap's
          # lastmod are the date of its last commit rather than today.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install "jinja2>=3.1"

      # Fails on a broken internal link or anchor, an image without alt text
      # or size, a page without exactly one h1, or a title or description
      # longer than a search result shows.
      - name: Build and check
        run: python website/build.py --check

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/_site

  deploy:
    name: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
