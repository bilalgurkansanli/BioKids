name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]"

      - name: ruff check
        run: ruff check src tests dev

      - name: ruff format --check
        run: ruff format --check src tests dev

      - name: mypy --strict (core + daemon)
        run: mypy

      - name: i18n catalogs are in sync
        run: python dev/check_i18n.py

      # Runs here rather than only in the build job, because the two mistakes it
      # catches are cheap to make and expensive to find: an .install glob that
      # matches nothing fails the whole build, and a file nothing installs
      # produces a perfectly green build that does not work.
      - name: the packaging names only things that exist
        run: python dev/check_packaging.py

      # The maintainer scripts and the PAM helper run as root on every family's
      # machine; a quoting mistake there is a broken install or worse.
      - name: shellcheck the scripts that run as root
        run: |
          shellcheck -s sh -S warning \
            debian/*.postinst debian/*.prerm debian/*.postrm debian/*.config \
            debian/pam/biokids-child-login debian/parent/biokids-open-setup

      - name: pytest
        run: pytest --cov=biokids_core --cov=biokids_daemon --cov-report=term-missing

  tests-on-trixie:
    name: tests against Debian 13's libraries
    # lint-and-test installs the newest release of everything from PyPI. An
    # installed BioKids never sees those: it runs on what trixie ships, which is
    # years older in places - argon2-cffi 21.1 against 25.1 - and the first real
    # install failed on an import only the newer one has (D-154).
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install the distribution's libraries, not PyPI's
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-asyncio python3-httpx \
            python3-alembic python3-sqlalchemy python3-fastapi \
            python3-uvicorn python3-jinja2 python3-argon2 \
            python3-cryptography python3-itsdangerous \
            python3-python-multipart python3-qrcode python3-dbus-next
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: pytest, as an ordinary user
        # Not as root. Root can chown to any uid and run adduser, so a test that
        # reaches the real machine passes as root - and changes the machine.
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          runuser -u tester -- env PYTHONPATH=src python3 -m pytest -p no:cacheprovider

  license-check:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]" pip-licenses
      - name: Fail on a non-permissive dependency license (D-30)
        run: python dev/check_licenses.py

  debian-package:
    name: build .deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python gnupg \
            grub-common po-debconf pybuild-plugin-pyproject python3-all \
            python3-setuptools lintian
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build packages
        # The full set, the archive keyring with it: the key's public half is
        # debian/biokids-archive-keyring.asc (D-257), so CI builds what a
        # release builds.
        #
        # The chmod is not paranoia: the tree is authored on Windows, where the
        # mode bit is not a thing .gitattributes can carry.
        run: |
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b

      - name: lintian
        # `bad-distribution-in-changes-file` is suppressed for the same reason
        # as in release.yml: a release changelog names this project's own suite,
        # which is not one of Debian's. Suppressed in both places, together.
        run: |
          lintian --fail-on error \
            --suppress-tags bad-distribution-in-changes-file \
            ../biokids_*.changes

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp ../*.deb dist/ || true

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  install-smoke:
    name: install, upgrade and remove on a clean Debian 13
    # A package that builds and passes lintian can still fail in its postinst:
    # the first real install did (D-153, D-154). This installs what was just
    # built into an empty trixie, the way a family would, and takes it out again.
    needs: debian-package
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: dist

      - name: Install the packages, without the desktop
        run: |
          apt-get update
          apt-get install -y ./dist/biokids-core_*.deb ./dist/biokids-daemon_*.deb \
            ./dist/biokids-panel_*.deb ./dist/biokids-voice_*.deb

      - name: The install left what it promises
        run: |
          set -eu
          biokids-admin version
          test -f /var/lib/biokids/biokids.db
          test "$(stat -c %a /var/lib/biokids)" = 700
          test "$(stat -c %a /var/lib/biokids-voices)" = 755
          test -f /etc/biokids/secret.key
          # D-171: the assistant's account is never in the group that can grant time.
          if id -nG biokids-ai | tr ' ' '\n' | grep -qx biokids; then
            echo "biokids-ai is in the biokids group" >&2; exit 1
          fi

      - name: Reinstalling is an upgrade that backs the database up first
        run: |
          set -eu
          apt-get install -y --reinstall ./dist/biokids-core_*.deb
          ls /var/lib/biokids/backups/biokids-*-upgrade.db

      - name: Remove, then purge
        run: |
          set -eu
          apt-get remove -y biokids-panel biokids-daemon biokids-voice biokids-core
          apt-get purge -y biokids-panel biokids-daemon biokids-voice biokids-core
          ! dpkg -l 'biokids*' 2>/dev/null | grep -q '^ii'

