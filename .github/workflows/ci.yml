name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]"

      - name: ruff check
        run: ruff check src tests dev

      - name: ruff format --check
        run: ruff format --check src tests dev

      - name: mypy --strict (core + daemon)
        run: mypy

      - name: i18n catalogs are in sync
        run: python dev/check_i18n.py

      # Runs here rather than only in the build job, because the two mistakes it
      # catches are cheap to make and expensive to find: an .install glob that
      # matches nothing fails the whole build, and a file nothing installs
      # produces a perfectly green build that does not work.
      - name: the packaging names only things that exist
        run: python dev/check_packaging.py

      - name: pytest
        run: pytest --cov=biokids_core --cov=biokids_daemon --cov-report=term-missing

  tests-on-trixie:
    name: tests against Debian 13's libraries
    # lint-and-test installs the newest release of everything from PyPI. An
    # installed BioKids never sees those: it runs on what trixie ships, which is
    # years older in places - argon2-cffi 21.1 against 25.1 - and the first real
    # install failed on an import only the newer one has (D-154).
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install the distribution's libraries, not PyPI's
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-asyncio python3-httpx \
            python3-alembic python3-sqlalchemy python3-fastapi \
            python3-uvicorn python3-jinja2 python3-argon2 \
            python3-cryptography python3-itsdangerous \
            python3-python-multipart python3-qrcode python3-dbus-next
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: pytest, as an ordinary user
        # Not as root. Root can chown to any uid and run adduser, so a test that
        # reaches the real machine passes as root - and changes the machine.
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          runuser -u tester -- env PYTHONPATH=src python3 -m pytest -p no:cacheprovider

  license-check:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]" pip-licenses
      - name: Fail on a non-permissive dependency license (D-30)
        run: python dev/check_licenses.py

  debian-package:
    name: build .deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python gnupg \
            po-debconf pybuild-plugin-pyproject python3-all \
            python3-setuptools lintian
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build packages
        # Without the archive keyring: its key exists only at release time, and
        # a pipeline that is red from the first commit teaches everyone to
        # ignore it. The release workflow builds the full set.
        #
        # The chmod is not paranoia: the tree is authored on Windows, where the
        # mode bit is not a thing .gitattributes can carry.
        run: |
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b -Ppkg.biokids.nokeyring

      - name: lintian
        # `bad-distribution-in-changes-file` is suppressed for the same reason
        # as in release.yml: a release changelog names this project's own suite,
        # which is not one of Debian's. Suppressed in both places, together.
        run: |
          lintian --fail-on error \
            --suppress-tags bad-distribution-in-changes-file \
            ../biokids_*.changes

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp ../*.deb dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error
