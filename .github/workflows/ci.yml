name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]"

      - name: ruff check
        run: ruff check src tests dev

      - name: ruff format --check
        run: ruff format --check src tests dev

      - name: mypy --strict (core + daemon)
        run: mypy

      - name: i18n catalogs are in sync
        run: python dev/check_i18n.py

      - name: pytest
        run: pytest --cov=biokids_core --cov=biokids_daemon --cov-report=term-missing

  license-check:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,daemon]" pip-licenses
      - name: Fail on a non-permissive dependency license (D-30)
        run: python dev/check_licenses.py

  debian-package:
    name: build .deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python \
            python3-all python3-setuptools pybuild-plugin-pyproject lintian
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b

      - name: lintian
        run: lintian --fail-on error ../*.changes

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp ../*.deb dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error
