# The English corner's lessons (D-225).
#
# Written for this project and released with it under the MIT licence. Each unit
# is a small world a child of four to ten knows - animals, colours, their family -
# in the order a child meets them: concrete things first, then the words that
# describe them, then what people do and feel.
#
# A unit has:
#   words      what the child meets one at a time, a picture each. `en` is what
#              the English voice says, `tr` what an older child reads under it,
#              `pic` the picture: an emoji, drawn by the colour emoji font.
#   lines      short sentences to listen to and say back: the chunks a child can
#              use whole ("Can I have water, please?") long before they could
#              build them. Only from the unit's own words and the commonest ones.
#   story      five or six lines with a picture each, read aloud, then questions.
#   questions  answered by tapping a picture; `answer` is one of `choices`.
#
# Ids are `<unit>/<word>`, `<unit>/line-<n>` and `<unit>/story`. A child's
# progress is kept by id, so a word, a line or a unit is never renamed once
# released; a new one is added instead.

