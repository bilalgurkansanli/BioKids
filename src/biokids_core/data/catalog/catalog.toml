# licences (GPL, LGPL) do not reach BioKids' own code (CLAUDE.md §6).

[[app]]
# The globe that works everywhere. Marble draws it itself (QPainter), with no
# OpenGL or WebGL, from maps the package installs: offline, and on a machine
# without graphics acceleration, where Google Earth on the web only says
# "WebGL is not supported". It opens on its offline Atlas map.
