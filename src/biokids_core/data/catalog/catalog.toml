[[app]]
slug = "google-earth"
name_tr = "Dünya"
name_en = "Earth"
exec = []
url = "https://earth.google.com/web"
# The whole host: the app moves itself to /static/multi-threaded/... at once.
allow = ["earth.google.com"]
package = ""
kind = "web"
icon = "earth"
default_category = "learning"
min_age = 6
max_age = 10
# Replaces Stellarium (D-165). The web version, which runs in the child's
# browser: Google Earth Pro for Linux is a proprietary package from Google's
# own repository, which BioKids does not add to a family's machine.
description_tr = "Google Earth: dünyayı uzaydan gez, şehirlere ve dağlara yaklaş. Hesap gerekmez."
description_en = "Google Earth: fly around the planet and zoom into cities and mountains. No account."

[[app]]
slug = "youtube-kids"
name_tr = "YouTube Kids"
name_en = "YouTube Kids"
exec = []
url = "https://www.youtubekids.com"
# Every visit starts with a sign-in check at accounts.google.com, signed in or
# not; without it the tile opened on "This page is blocked".
allow = ["youtubekids.com", "accounts.google.com"]
package = ""
kind = "web"
icon = "video"
default_category = "web"
min_age = 4
max_age = 10
# Not ticked by default: it is Google's, it shows short ads unless the family
# pays for YouTube Premium, and the first visit asks a parent to choose a
# content level. A parent who wants it ticks it.
suggest = false
description_tr = "Çocuklar için seçilmiş videolar. İlk açılışta bir ebeveynin ayar yapması gerekir; kısa reklamlar içerir."
description_en = "Videos chosen for children. A parent sets it up on the first visit; shows short ads."

