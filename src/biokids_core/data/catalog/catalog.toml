# Chrome Music Lab (D-210), checked on 2026-10-11: free, no ads, no account,
# fourteen experiments in pictures - rhythm, a song grid, sound waves, drawing
# that plays. The menu's words are English (the site maps Turkish to English),
# but nothing in it needs reading, so unlike PBS KIDS it is ticked. Each
# experiment opens in a frame: thirteen from the site itself, Song Maker from
# its own host, which "selected sites only" mode would close without `allow`.
# Its scripts and fonts come from ajax.googleapis.com, gstatic.com and
# fonts.googleapis.com, which the browser's URL filter does not govern (it
# governs pages and frames). The two experiments that listen to a microphone
# (Spectrogram, Voice Spinner) cannot: the child's browser allows the
# microphone to the launcher alone.
slug = "chrome-music-lab"
name_tr = "Müzik Atölyesi"
name_en = "Music Lab"
exec = []
url = "https://musiclab.chromeexperiments.com/"
allow = ["musiclab.chromeexperiments.com", "gweb-song-maker.appspot.com"]
package = ""
kind = "web"
icon = "piano"
default_category = "learning"
min_age = 4
max_age = 10
description_tr = "Google'ın müzik deneyleri: ritim yap, şarkı besteleyip çal, sesin şeklini gör. Menüsü İngilizce; okuma gerekmez, reklamsız, hesap gerekmez."
