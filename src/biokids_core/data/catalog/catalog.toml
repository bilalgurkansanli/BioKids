# The BioKids application catalog (D-20).
#
# Apps are data, not code. This file is installed to
# /usr/share/biokids/catalog/catalog.toml and loaded into the `app` table on
# install and upgrade. A parent picks from it in the wizard; nothing a parent
# did not enable ever appears on a child's screen.
#
# Fields:
#   slug              stable identifier; never renamed once released
#   name_tr/name_en   the tile label
#   exec              argv, as a list. Empty for `builtin` and `web` tiles
#   package           the Debian package that provides `exec`; empty for builtins
#   kind              app | web | builtin
#   default_category  games | learning | web | free   (the parent may reassign)
#   min_age/max_age   what the wizard pre-selects for a child of that age
#   suggest           false keeps a tile out of that pre-selection (default true)
#   allow             for a web tile, what the browser may open in "selected sites
#                     only" mode, as Chromium URL filters; default: the URL's host
#
# Apps that would start full screen are started windowed instead (D-163): full
# screen hides the title bar and its close button, and a child with no way out
# of an app is stuck. The launcher then fills the screen with the window.
#
# An app whose package is not installed is simply not shown. The metapackage
# `biokids-desktop` pulls in the ones marked as part of the default set.

[[app]]
slug = "gcompris"
name_tr = "GCompris"
name_en = "GCompris"
exec = ["gcompris-qt", "--window"]
package = "gcompris-qt"
kind = "app"
icon = "blocks"
default_category = "learning"
min_age = 4
max_age = 10
description_tr = "Sayılar, harfler, renkler ve yüzlerce küçük oyun."
description_en = "Numbers, letters, colours and hundreds of small activities."

