# --- a game that fills the row (D-210) --------------------------------------
# The owner saw a six-year-old's home screen end in a row of four under rows of
# six and asked for one more game. Held to D-203's rules: trixie main (KDiamond
# 4:25.04.0-1), offline, a Turkish interface, in a window of its own with no
# full-screen option to turn off, and nothing to read while playing. GPL-2+, a
# separate program the launcher starts (CLAUDE.md §6).
#
# Not taken: Ri-li, the wooden toy train. It has no command-line options at all
# - its first argument is read as a data directory - and it starts full screen
# unless its own settings file says otherwise; none of its fourteen languages
# is Turkish, its first start asks the child to pick one by flag, and between
# levels it asks a question about a human-rights article in that language.

[[app]]
slug = "kdiamond"
name_tr = "Elmaslar"
name_en = "Diamonds"
exec = ["kdiamond"]
package = "kdiamond"
kind = "app"
icon = "diamond"
default_category = "games"
min_age = 4
max_age = 10
description_tr = "Yan yana iki elmasın yerini değiştir; aynı renkten üçü bir sıraya gelince kaybolur. Okuma gerekmez."
description_en = "Swap two neighbouring diamonds; three of a colour in a row disappear. No reading needed."

