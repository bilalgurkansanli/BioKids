# Bugünün sürprizi - "today's surprise" on the launcher's home screen (D-203).
#
# One small card a day, inside a theme that changes every week. Everything a
# child reads here was written and checked by people; nothing is generated.
#
# Rules for every entry, because a parental control must never teach a child
# something untrue or leave them frightened:
#   - Only facts that are settled and checkable in an encyclopedia. When a
#     number is approximate, the sentence says so ("yaklaşık", "about").
#   - Nothing frightening: no danger, no injury, no death, no predators eating.
#   - The child is "sen", never "siz" (UX.md §4). A task is something a child
#     can do safely in a room, or with a grown-up ("bir büyüğünle").
#   - Turkish first, written to be read aloud; English says the same thing.
#   - `text` is one short sentence: all a child of four to seven sees, and what
#     Zio reads when they tap it. `more` is one more sentence for eight to ten.
#   - Lengths (tests/test_daily.py): text 120, more 140, title 24, answer 32.
#
# Fields:
#   [[theme]]  slug, emoji, label_tr/label_en (the weekly chip), accent - one of
#              the brand tokens: coral, amber, teal, indigo, ok
#   [[item]]   id (stable), theme, kind, emoji (not for a riddle), text_tr/text_en,
#              more_tr/more_en (optional),
#              title_tr/title_en (the animal or the word; animal and word only),
#              answer_tr/answer_en (riddle only; a riddle has no emoji of its
#              own and shows 🤔, so the picture never gives the answer away),
#              app (challenge only: a catalogue slug; the card is drawn only for
#              a child who has that tile, and its text names the tile),
#              bands (optional; default both, "4-7" and "8-10")
#
# Kinds: fact (Biliyor muydun?), riddle (Bilmece), animal (Günün hayvanı),
# challenge (Bugünün görevi), word (Bugünün kelimesi). Themes are visited in the
# order they are listed, one a week.

