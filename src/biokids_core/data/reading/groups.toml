# Okuma köşesi - the Turkish reading corner (D-241).
#
# The way Turkish first grade teaches reading (MEB's ses temelli cümle
# yöntemi): sounds in five groups, each group's letters met one by one, then
# syllables made of the letters met so far, then words, then a short sentence.
# A child never sees a letter they have not met: the loader refuses a syllable,
# a word or a sentence that uses one (tests/test_reading.py too).
#
# Rules for every entry:
#   - Words a child of five to seven knows, each with a picture that says it
#     at once; nothing frightening.
#   - `syllables` is the word as it is read aloud in the classroom, "an-ne".
#   - A sentence is short, plain, and its picture is one of the words met.
#   - Turkish lower case throughout; the page draws the capital too.
#
# Fields:
#   [[group]]   slug, title, letters (in the order they are met)
#   [[group.letter]]  char, hint (syllables Zio says to make the sound: "la, le,
#                     li"), word, pic (a word with the sound, and its picture)
#   [[group.syllables]] one list of syllables
#   [[group.word]]    text, syllables, pic
#   [[group.sentence]] text, pic

