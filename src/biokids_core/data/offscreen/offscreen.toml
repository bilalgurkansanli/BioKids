# Şimdi ne yapsak? - "what shall we do now?" (D-231).
#
# When the screen time ends, at night, between two of the day's windows, and in
# a break, Zio hands the child over to something away from the screen instead
# of only taking the screen away. Everything here was written and checked by
# people; nothing is generated.
#
# Rules for every card:
#   - Something a child can do safely in a room, alone or with a grown-up
#     ("bir büyüğünle"). Nothing that needs scissors, the stove, the street or
#     water play; no climbing.
#   - Nothing that sends the child back to a screen.
#   - The child is "sen", never "siz" (UX.md §4). One short sentence, written to
#     be read aloud: Zio says it. English says the same thing.
#   - Lengths (tests/test_offscreen.py): text 90.
#
# Fields:
#   [[card]]  id (stable), moment, kind, emoji, text_tr, text_en,
#             bands (optional; default both, "4-7" and "8-10")
#
# Moments: end (the day's time is up, or a window closed until later), night
# (the day ended in the evening, D-214), break (a forced break, D-46: a few
# moves and rest for the eyes).
# Kinds: make, play, talk, help, read, move, eyes, calm.

# ---------------------------------------------------------------- the end

