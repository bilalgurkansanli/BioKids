# BioKids (D-200): no boot menu in front of a child. The machine starts the
# default entry after a second with nothing on screen; pressing Esc during that
# second shows the menu, with its recovery mode, as before. biokids-desktop
# links this file into /etc/default/grub.d while it is installed and removes
# the link when it is removed, so "apt remove" brings the menu back.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1

# Beside Windows (D-252) the family has to be able to choose it: the menu
# shows for five seconds. On UEFI, Windows' boot manager lives on the EFI
# partition this computer shares with it; a Windows installed the old (BIOS)
# way is found by os-prober, as GRUB's own script finds it. That script never
# shows a hidden menu by itself.
if [ -e /boot/efi/EFI/Microsoft/Boot/bootmgfw.efi ] || {
    command -v os-prober >/dev/null 2>&1 && os-prober 2>/dev/null | grep -qi windows
}; then
    GRUB_TIMEOUT_STYLE=menu
    GRUB_TIMEOUT=5
fi
