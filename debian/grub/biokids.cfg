# BioKids (D-200): no boot menu in front of a child. The machine starts the
# default entry after a second with nothing on screen; pressing Esc during that
# second shows the menu, with its recovery mode, as before. biokids-desktop
# links this file into /etc/default/grub.d while it is installed and removes
# the link when it is removed, so "apt remove" brings the menu back.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
