# BioKids: a child logs in by choosing their picture (D-99, D-155).
#
# biokids-lightdm is Debian's lightdm PAM service with one rule in front of it;
# see /etc/pam.d/biokids-lightdm. Shipped here rather than in /etc so that an
# administrator's own /etc/lightdm/lightdm.conf still has the last word.
[Seat:*]
pam-service=biokids-lightdm
# D-99: the login screen is a set of pictures, so the user list is shown.
# Debian hides it by default (01_debian.conf) so that a machine does not
# advertise its accounts; on a family computer the accounts are the family.
greeter-hide-users=false
# D-251: the family's pictures, big; Debian's GTK greeter whenever it fails.
greeter-session=biokids-greeter
