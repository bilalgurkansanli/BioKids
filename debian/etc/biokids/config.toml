# /etc/biokids/config.toml - machine-level configuration for BioKids.
#
# Nothing about a family lives here. Children, quotas, time windows, the PIN,
# mail settings and the audit log are in the database and are managed from the
# parent panel. This file holds what a machine needs before it has a family:
# paths, ports and timings.
#
# Every setting below is commented out and shows its built-in default. The
# defaults live in the code, so an upgrade that changes one reaches you without
# dpkg asking about this file. To change a value, uncomment its line. A key a
# later version no longer uses is ignored with a warning; a misspelt key or a
# value of the wrong type is refused at startup, because guessing at a
# parental-control configuration is worse than refusing to start.

[paths]
# The filesystem layout. Changing one moves where BioKids looks; it does not
# move the data. BIOKIDS_PREFIX in the environment re-roots all of them at once.
# config_dir = "/etc/biokids"
# data_dir = "/var/lib/biokids"
# db_path = "/var/lib/biokids/biokids.db"
# voice_cache_dir = "/var/lib/biokids/voice-cache"
# model_dir = "/var/lib/biokids-voices/models"
# piper_dir = "/var/lib/biokids-voices/piper"
# run_dir = "/run/biokids"
# daemon_socket = "/run/biokids/daemon.sock"
# shell_socket = "/run/biokids/shell.sock"
# share_dir = "/usr/share/biokids"
# secret_key = "/etc/biokids/secret.key"
# chromium_policy_dir = "/etc/chromium/policies/managed"
# extension_dir = "/var/lib/biokids-ext"
# extension_key = "/var/lib/biokids/extension-key.pem"
# recorded_voice_dir = "/var/lib/biokids-voices"
# ai_run_dir = "/run/biokids-ai"
# ai_models_dir = "/var/lib/biokids-ai/models"

[panel]
# The parent panel. It listens on loopback only and refuses anything else;
# a phone reaches it through Tailscale (D-33).
# host = "127.0.0.1"
# port = 7878
# session_idle_minutes = 30
# pin_attempts = 5
# pin_lockout_minutes = 15
# pin_lockout_max_minutes = 1440

[shell]
# The child's launcher. Each child's launcher listens on port + uid % 100.
# host = "127.0.0.1"
# port = 7879
# kiosk_command = "chromium"
# kiosk_restart_seconds = 2

[daemon]
# tick_seconds = 10
# persist_seconds = 30
# clock_jump_threshold_seconds = 600
# socket_group = "biokids"
# socket_mode = 0o660
# lock_countdown_seconds = 120
# app_term_grace_seconds = 10

[voice]
# enabled = true
# socket_name = "biokids-voice.sock"
# cache_max_mb = 200
# queue_depth = 3
# duck_percent = 30
# piper_binary = "piper"
# espeak_binary = "espeak-ng"
# mbrola_binary = "mbrola"
# quiet_hours = ""          # e.g. "21:00-08:00": the cards still show, nothing is spoken

[ai]
# The optional assistant (biokids-ai).
# assistant_per_10min = 20
# english_turns_per_10min = 40   # English with Sio, counted apart (D-226)
# llama_server_binary = "llama-server"
# whisper_server_binary = "whisper-server"
# kiwix_serve_binary = "kiwix-serve"
# idle_unload_minutes = 10
# threads = 0               # 0: half the logical CPUs, at most 8

[retention]
# How long records are kept, in days. Nothing is kept forever.
# activity_days = 30        # apps used, sites visited, hours of the day, assistant alerts
# usage_days = 400          # minutes per day and per app, for history and insights
# audit_days = 365
# requests_days = 90

[i18n]
# default_locale = "tr"
# available = ["tr", "en"]
