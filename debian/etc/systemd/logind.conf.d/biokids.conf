# No getty for a child to find (D-54, T5.7).
#
# Ctrl+Alt+F2 is the oldest way out of a kiosk: the graphical session goes away
# and a login prompt appears, and from there a shell, and from a shell the whole
# machine. `DontVTSwitch` in the X configuration is meant to stop the switch
# itself, but it is one flag in one server that a crash or a reconfigure can
# take away, so this is the second half: even when the switch works, there is
# nothing on the other side to log in to.
#
# NAutoVTs=1 means logind spawns a getty on VT1 only, and VT1 is where the
# graphical session already is. VT2 to VT6 stay empty.
#
# ReserveVT=1 keeps one virtual terminal allocated rather than none. That is
# deliberate: a machine with no VT at all is a machine a parent cannot recover
# from a broken X server without a rescue disk, and bricking the family computer
# is a worse outcome than the escape this closes (principle #4).
#
# Recovering a machine whose graphical session will not start: boot the recovery
# entry from GRUB, or reach it over the tailnet with ssh. Both are documented in
# docs/SECURITY.md.
[Login]
NAutoVTs=1
ReserveVT=1
