# The other half of D-54: the switch itself, not just what is on the far side.
#
# DontVTSwitch makes the X server refuse Ctrl+Alt+F1 through Ctrl+Alt+F12, so
# the child's session cannot be left by keyboard. DontZap does the same for
# Ctrl+Alt+Backspace, which kills the X server outright and would otherwise drop
# the child back to the greeter with the launcher gone.
#
# This is machine-wide, so it applies to a parent's session too. That is the
# intended trade (D-54) and it is why the logind drop-in beside this file keeps
# one VT reserved: the recovery path is GRUB's recovery entry or ssh over the
# tailnet, never Ctrl+Alt+F2.
#
# Neither flag survives a determined ten-year-old with a phone and a search
# engine - they are a speed bump, and `src/biokids_shell/xfce/README.md` says so
# rather than letting a parent feel safer than they are.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection
