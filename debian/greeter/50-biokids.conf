# BioKids: the login screen is the family's (D-170).
#
# Overrides Debian's 01_debian.conf, which draws the distribution's background
# and logo. A child picks their own picture here, so the screen shows Zio and
# Sio and nothing about the operating system. Shipped under /usr/share so that
# an administrator's /etc/lightdm/lightdm-gtk-greeter.conf has the last word.
[greeter]
background=/usr/share/biokids/greeter/background.png
# A user's own desktop background would replace ours as soon as they are
# selected; the children's desktop is the launcher, never seen here.
user-background=false
theme-name=Adwaita
# No host name in the top bar: "biokids-vm" means nothing to a child.
indicators=~spacer;~clock;~spacer;~a11y;~power
clock-format=%H:%M
