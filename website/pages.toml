# Every page of the site, in both languages.
#
#   key          names the body: content/<lang>/<key>.html
#   kind         home, page, guide, faq, about, support, 404
#   path         the address; every page is a folder with an index.html
#   title        <title> and og:title, 20-65 characters (build.py --check)
#   description  meta description, 70-165 characters
#   short        the name in menus, breadcrumbs and cards
#   summary      the line under a guide's name on the guides page
#   guide        order, minutes, level (easy, medium, advanced), icon, and what
#                you need (supply) and use (tool), for the guide's HowTo data
#
# Changing a path breaks every link anyone has made to it. Do not, after launch.

