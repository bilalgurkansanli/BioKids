site_alt_name = "BioKids — parental-control Linux for kids"
software_category = "Parental control"
software_description = "BioKids is a free, open-source parental-control system for children aged 4–10, built on Debian 13: screen-time limits that changing the clock cannot fool, safe browsing, a live view of the child's screen on the parent's phone, and an AI assistant that runs on the computer itself. No account, no cloud; nothing leaves the device."
audience = "Parents of children aged 4–10"
req_memory = "4 GB RAM (7 GB for the optional assistant)"
req_disk = "About 25 GB of disk"
feature_list = [
  "Daily time quotas, allowed hours, weekday and weekend rules",
  "Screen time counted on CLOCK_BOOTTIME, so changing the clock cannot fool it",
  "Live view of the child's screen from the parent's phone, always shown to the child",
  "Ask Me, an AI assistant that runs on the computer (Gemma via llama.cpp, Whisper)",
  "Offline Wikipedia",
  "A local DNS filter that blocks adult, gambling, malware and scam sites",
  "Enforced SafeSearch and a managed Chromium",
  "Ask a grown-up: requests for time, sites and apps",
  "Zio and Sio: spoken warnings in a mother's and a father's voice",
  "Breaks, eye exercises and earned time",
  "History, a year-long heatmap of screen time, and an audit log",
  "Secure phone access over Tailscale, never port forwarding",
  "No telemetry, no account, no cloud",
]
llms_intro = """
BioKids turns a Debian 13 computer into one a 4–10-year-old can use alone. The child signs in by tapping their picture and lands in a full-screen launcher of big tiles instead of a desktop; a ring shows the minutes left, and two voices, Zio and Sio, say when time is running out. The parent sets the rules in a panel on the same computer or on their phone (over their own Tailscale network). Screen time is counted on the kernel's boot-time clock, so changing the system clock changes nothing. Harmful sites are blocked by a local DNS filter on the children's accounts only, SafeSearch is enforced, and nothing about the family leaves the computer: no telemetry, no account, no cloud. A parent can watch the child's screen live, and the child always sees a sign that says so. An optional assistant, Ask Me (Sor Bana), answers a child's questions with a language model that runs on the computer itself (Gemma via llama.cpp, Whisper for speech, an offline Wikipedia).

BioKids ships as a ready-to-install ISO (Debian 13 with BioKids; it can install beside Windows) and as Debian packages. It is made for one curious child alone at one computer; it does not stop an adult with a USB stick, and it does not protect phones or tablets.
"""
