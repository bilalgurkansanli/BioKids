# The Debian installer, as BioKids starts it (D-249). Only what a family would
# never want to be asked is answered here. The language, the keyboard, the
# parent's name and password and, above all, the disk are left to the person
# installing: on a computer that has Windows the installer then offers to
# shrink it and install beside it, and nothing is erased that was not chosen.

# The computer's name on the home network, and no domain: questions a family
# cannot answer (D-252). netcfg/hostname wins over a name the router offers.
d-i netcfg/get_hostname string biokids
d-i netcfg/get_domain string
d-i netcfg/hostname string biokids

# The first user - the parent - administers the machine with sudo.
d-i passwd/root-login boolean false

# Turkey's time zone and a clock in UTC unless the installer finds Windows,
# which keeps the hardware clock in local time.
d-i time/zone string Europe/Istanbul
d-i clock-setup/utc boolean true

# Nothing leaves the device (CLAUDE.md principle 1): no package survey.
popularity-contest popularity-contest/participate boolean false

# The install copies the system from the stick and needs no network; Debian's
# mirror, for the updates after it, is written by late_command below.

# The boot menu lists Windows too.
d-i grub-installer/with_other_os boolean true

# What the live installer leaves undone - the language chosen at the start, and
# Debian's mirror and security updates - is done by a script at the very end
# (D-252); see it for why.
d-i preseed/late_command string sh /usr/lib/biokids/late-command
