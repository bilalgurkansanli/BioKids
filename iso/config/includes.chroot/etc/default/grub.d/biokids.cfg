# BioKids (D-249): look for other systems, so that a computer installed beside
# Windows keeps Windows in the boot menu after every kernel update. Debian
# turns os-prober off by default since GRUB 2.06. GRUB_DISTRIBUTOR stays
# Debian's: the UEFI boot entry and Secure Boot's shim expect /EFI/debian.
GRUB_DISABLE_OS_PROBER=false
